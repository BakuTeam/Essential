name: PHP checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Lint PHP source
        shell: bash
        run: find src build -type f -name '*.php' -print0 | xargs -0 -n1 php -l
