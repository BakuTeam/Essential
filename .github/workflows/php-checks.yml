name: PHP checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-pmmpthread

      - name: Run protocol smoke test
        run: php -d memory_limit=512M tests/protocol-support.php

      - name: Lint PHP source
        shell: bash
        run: find src build -type f -name '*.php' -print0 | xargs -0 -n1 php -l
