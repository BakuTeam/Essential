memory:
  global-limit: 0
  main-limit: 0
  main-hard-limit: 1024
  async-worker-hard-limit: 256
  check-rate: 20
  continuous-trigger: true
  gc-manager-enabled: true
  continuous-trigger-rate: 30

  garbage-collection:
    period: 36000
  memory-dump:
    dump-async-worker: true
  max-chunks:
    chunk-radius: 4

debug:
  level: 1

player:
  save-player-data: true
  verify-xuid: true

chunk-sending:
  per-tick: 4
  spawn-radius: 4

chunk-ticking:
  tick-radius: 3
  blocks-per-subchunk-per-tick: 3
  disable-block-ticking:
    #- grass
    #- ice
    #- fire

chunk-generation:
  population-queue-size: 32

ticks-per:
  autosave: 6000

auto-report:
  enabled: true
  send-code: true
  send-settings: true
  send-phpinfo: false
  use-https: true
  host: crash.pmmp.io

anonymous-statistics:
  enabled: false
  host: stats.pocketmine.net

auto-updater:
  enabled: true
  on-update:
    warn-console: true
  preferred-channel: stable
  suggest-channels: true
  host: update.pmmp.io

timings:
  host: timings.pmmp.io

console:
  enable-input: true
  title-tick: true

aliases:
  #stop: [shutdown]

worlds:
  #world:
  # seed: 404
  # generator: FLAT
  # preset: 2;bedrock,59xstone,3xdirt,grass;1

plugins:
  legacy-data-dir: false

settings:
  force-language: false
  shutdown-message: "Server is restarting"
  query-plugins: true
  enable-profiling: false
  profile-report-trigger: 20
  async-workers: auto
  enable-dev-builds: false
  disable-vibrant-visual: true

network:
  batch-threshold: 256
  compression-level: 7
  async-compression: true
  async-compression-threshold: 10000
  #Send combat feedback before the normal tick flush. Limited to one early batch per player per tick.
  combat-low-latency-feedback: true
  upnp-forwarding: false
  max-mtu-size: 850
  enable-encryption: true

level-settings:
  default-format: leveldb
  min-y: 0
